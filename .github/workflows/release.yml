name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to release (e.g. v0.1.0)"
        required: true

jobs:
  create-release:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - name: Create draft release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.tag || github.ref_name }}
          target_commitish: ${{ github.sha }}
          draft: true
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build-app:
    needs: create-release
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            target: aarch64-apple-darwin
          - platform: macos-latest
            target: x86_64-apple-darwin
          - platform: windows-latest
            target: x86_64-pc-windows-msvc
          - platform: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
    runs-on: ${{ matrix.platform }}
    env:
      # `tauri signer sign` reads these env vars (see `pnpm tauri signer sign --help`).
      TAURI_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY || secrets.TAURI_PRIVATE_KEY }}
      TAURI_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD || secrets.TAURI_PRIVATE_KEY_PASSWORD }}
      # Keep the new names too in case future tooling expects them.
      TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY || secrets.TAURI_PRIVATE_KEY }}
      TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD || secrets.TAURI_PRIVATE_KEY_PASSWORD }}
      # macOS signing (self-signed, for stable identity across updates).
      # Store your `.p12` as base64 in a secret, e.g.:
      #   base64 -i cyberzen-codesign.p12 | pbcopy
      # If `security import` fails on GitHub macOS runners, re-export a legacy-compatible p12:
      #   openssl pkcs12 -export -legacy -inkey cyberzen-codesign.key -in cyberzen-codesign.crt -certfile cyberzen-root.crt -out cyberzen-codesign.p12
      MACOS_CODESIGN_P12_BASE64: ${{ secrets.MACOS_CODESIGN_P12_BASE64 }}
      MACOS_CODESIGN_P12_PASSWORD: ${{ secrets.MACOS_CODESIGN_P12_PASSWORD }}
      MACOS_KEYCHAIN_PASSWORD: ${{ secrets.MACOS_KEYCHAIN_PASSWORD }}
      MACOS_CODESIGN_IDENTITY: ${{ secrets.MACOS_CODESIGN_IDENTITY }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref_name }}

      - name: Setup pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 10.27.0

      - name: Setup node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: |
            src-tauri -> src-tauri/target

      - name: Install rust target
        run: rustup target add ${{ matrix.target }}

      - name: Install dependencies (ubuntu only)
        if: startsWith(matrix.platform, 'ubuntu')
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            libudev-dev \
            patchelf \
            libx11-dev \
            libxtst-dev \
            libxi-dev

      - name: Install front-end dependencies
        run: pnpm install --frozen-lockfile

      - name: Build Tauri bundles (macOS)
        if: startsWith(matrix.platform, 'macos')
        run: pnpm -s tauri build --ci --target ${{ matrix.target }} --bundles app

      - name: Build Tauri bundles (non-macOS)
        if: "!startsWith(matrix.platform, 'macos')"
        run: pnpm -s tauri build --ci --target ${{ matrix.target }}

      - name: Import macOS code signing certificate
        if: startsWith(matrix.platform, 'macos')
        shell: bash
        run: |
          bash scripts/ci/macos-import-codesign-cert.sh

      - name: Package signed macOS artifacts (signed .app + signed .dmg)
        if: startsWith(matrix.platform, 'macos')
        env:
          TAG: ${{ inputs.tag || github.ref_name }}
        shell: bash
        run: |
          set -euo pipefail

          VERSION="${TAG#v}"
          MAC_ASSET_ARCH=""
          case "${{ matrix.target }}" in
            aarch64-apple-darwin) MAC_ASSET_ARCH="aarch64" ;;
            x86_64-apple-darwin) MAC_ASSET_ARCH="x64" ;;
            *) echo "Unsupported macOS target: ${{ matrix.target }}"; exit 1 ;;
          esac

          TARGET_TRIPLE="${{ matrix.target }}" VERSION="$VERSION" MAC_ASSET_ARCH="$MAC_ASSET_ARCH" \
            bash scripts/ci/macos-package-and-sign-dmg.sh

      - name: Generate updater entry (for latest.json)
        id: updater_entry
        env:
          TAG: ${{ inputs.tag || github.ref_name }}
        shell: bash
        run: |
          set -euo pipefail

          if [ -z "${TAURI_PRIVATE_KEY:-}" ]; then
            echo "TAURI_PRIVATE_KEY is empty. Configure a signing secret (e.g. TAURI_SIGNING_PRIVATE_KEY / TAURI_PRIVATE_KEY)."
            exit 1
          fi

          VERSION="${TAG#v}"
          BUNDLE_DIR="src-tauri/target/${{ matrix.target }}/release/bundle"
          if [ ! -d "$BUNDLE_DIR" ]; then
            echo "Bundle dir not found: $BUNDLE_DIR"
            exit 1
          fi

          ARCH_LABEL=""
          MAC_ASSET_ARCH=""
          PATTERNS=""
          case "${{ matrix.target }}" in
            aarch64-apple-darwin)
              JSON_TARGET="darwin-aarch64"
              ARCH_LABEL="aarch64"
              MAC_ASSET_ARCH="aarch64"
              ;;
            x86_64-apple-darwin)
              JSON_TARGET="darwin-x86_64"
              ARCH_LABEL="x86_64"
              MAC_ASSET_ARCH="x64"
              ;;
            x86_64-pc-windows-msvc)
              JSON_TARGET="windows-x86_64"
              ARCH_LABEL="x86_64"
              # On Windows, the updater can download either a zip or the raw installer (.exe/.msi).
              # Prefer NSIS `*-setup.exe` to match common Tauri updater usage (see BongoCat latest.json).
              PATTERNS="*-setup.exe.zip *-setup.exe *.msi.zip *.msi"
              ;;
            x86_64-unknown-linux-gnu)
              JSON_TARGET="linux-x86_64"
              ARCH_LABEL="x86_64"
              # On Linux, the updater can download a raw AppImage.
              PATTERNS="*.AppImage.tar.gz *.appimage.tar.gz *.AppImage *.appimage"
              ;;
            *)
              echo "Unsupported target for updater manifest: ${{ matrix.target }}"
              exit 1
              ;;
          esac

          ARCHIVE=""
          if [[ "${{ matrix.target }}" == *apple-darwin ]]; then
            ARCHIVE="release-assets/CyberZen_${VERSION}_${MAC_ASSET_ARCH}.app.tar.gz"
          else
            for pattern in $PATTERNS; do
              found="$(find "$BUNDLE_DIR" -type f -name "$pattern" -print -quit || true)"
              if [ -n "$found" ]; then
                ARCHIVE="$found"
                break
              fi
            done
          fi

          if [ -z "$ARCHIVE" ]; then
            echo "Could not find updater payload under: $BUNDLE_DIR"
            echo "Files present:"
            find "$BUNDLE_DIR" -type f | sed -n '1,200p'
            exit 1
          fi

          ASSET_NAME="$(basename "$ARCHIVE")"

          # `tauri signer sign` prints extra logs; use the generated `.sig` file to build a clean base64 signature.
          SIGN_OUT="$(pnpm -s tauri signer sign "$ARCHIVE" 2>&1)" || {
            echo "$SIGN_OUT"
            exit 1
          }
          SIG_FILE="${ARCHIVE}.sig"
          if [ ! -f "$SIG_FILE" ]; then
            echo "Signature file not found: $SIG_FILE"
            exit 1
          fi
          # `.sig` already contains the base64-encoded minisign signature; keep it as-is (strip whitespace only).
          SIGNATURE="$(node -e 'const fs=require("fs");const p=process.argv[1];process.stdout.write(fs.readFileSync(p,"utf8").replace(/\\s+/g,""));' "$SIG_FILE")"

          mkdir -p updater-entries
          OUT_JSON="updater-entries/${JSON_TARGET}.json"
          JSON_TARGET="$JSON_TARGET" ASSET_NAME="$ASSET_NAME" SIGNATURE="$SIGNATURE" OUT_JSON="$OUT_JSON" \
            node -e 'const fs=require("fs");const entry={json_target:process.env.JSON_TARGET,asset_name:process.env.ASSET_NAME,signature:process.env.SIGNATURE};fs.writeFileSync(process.env.OUT_JSON, JSON.stringify(entry) + "\n");'

          echo "archive_path=$ARCHIVE" >> "$GITHUB_OUTPUT"

      - name: Collect release assets
        id: collect_assets
        env:
          TAG: ${{ inputs.tag || github.ref_name }}
        shell: bash
        run: |
          set -euo pipefail

          VERSION="${TAG#v}"
          BUNDLE_DIR="src-tauri/target/${{ matrix.target }}/release/bundle"

          files=()

          if [[ "${{ matrix.target }}" == *apple-darwin ]]; then
            MAC_ASSET_ARCH=""
            case "${{ matrix.target }}" in
              aarch64-apple-darwin) MAC_ASSET_ARCH="aarch64" ;;
              x86_64-apple-darwin) MAC_ASSET_ARCH="x64" ;;
              *) echo "Unsupported macOS target: ${{ matrix.target }}"; exit 1 ;;
            esac
            mac_dmg="release-assets/CyberZen_${VERSION}_${MAC_ASSET_ARCH}.dmg"
            mac_updater="release-assets/CyberZen_${VERSION}_${MAC_ASSET_ARCH}.app.tar.gz"
            if [[ ! -f "$mac_dmg" || ! -f "$mac_updater" ]]; then
              echo "Expected macOS release assets not found."
              echo "Expected:"
              echo "  - $mac_dmg"
              echo "  - $mac_updater"
              echo "Found in release-assets/:"
              ls -la release-assets || true
              exit 1
            fi
            files+=("$mac_dmg")
            files+=("$mac_updater")
          elif [[ "${{ matrix.target }}" == *windows* ]]; then
            while IFS= read -r -d '' f; do files+=("$f"); done < <(find "$BUNDLE_DIR" -type f \( -name '*-setup.exe' -o -name '*-setup.exe.zip' -o -name '*.msi' -o -name '*.msi.zip' \) -print0)
          else
            while IFS= read -r -d '' f; do files+=("$f"); done < <(find "$BUNDLE_DIR" -type f \( -name '*.AppImage*' -o -name '*.deb' -o -name '*.rpm' -o -name '*.tar.gz' \) -print0)
          fi

          if [[ "${#files[@]}" -eq 0 ]]; then
            echo "No release assets found to upload."
            echo "Bundle dir content:"
            find "$BUNDLE_DIR" -maxdepth 4 -print | sed -n '1,200p' || true
            exit 1
          fi

          printf '%s\n' "${files[@]}" > release-files.txt
          echo "Will upload the following files:"
          cat release-files.txt

          {
            echo 'files<<EOF'
            cat release-files.txt
            echo EOF
          } >> "$GITHUB_OUTPUT"

      - name: Upload release assets
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.tag || github.ref_name }}
          files: ${{ steps.collect_assets.outputs.files }}
          fail_on_unmatched_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload updater entry artifact
        uses: actions/upload-artifact@v4
        with:
          name: updater-entry-${{ matrix.target }}
          path: updater-entries/*.json

  updater-manifest:
    needs: build-app
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref_name }}

      - name: Setup node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Download updater entry artifacts
        uses: actions/download-artifact@v4
        with:
          path: updater-entries

      - name: Generate latest.json
        run: |
          node scripts/updater/generate-latest-json.mjs \
            --repo "$GITHUB_REPOSITORY" \
            --tag "${{ inputs.tag || github.ref_name }}" \
            --entries-dir updater-entries \
            --out latest.json

      - name: Upload latest.json to release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.tag || github.ref_name }}
          files: latest.json
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
